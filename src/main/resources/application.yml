spring:
  application:
    name: kharcha-api
  # Default: in-memory H2 in PostgreSQL mode, so you can run with zero setup.
  datasource:
    url: jdbc:h2:mem:kharcha;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH
    username: sa
    password:
  h2:
    console:
      enabled: true   # http://localhost:8080/h2-console  (JDBC URL above)
  jpa:
    hibernate:
      ddl-auto: validate   # Flyway owns the schema; Hibernate only checks it matches
    open-in-view: false    # no lazy loading leaking into controllers
    properties:
      hibernate.format_sql: true

server:
  port: 8080

management:
  endpoints:
    web:
      exposure:
        include: health,info

---
spring:
  config:
    activate:
      on-profile: postgres
  datasource:
    url: jdbc:postgresql://localhost:5432/kharcha
    username: ${DB_USER:kharcha}
    password: ${DB_PASSWORD:kharcha}
  h2:
    console:
      enabled: false
